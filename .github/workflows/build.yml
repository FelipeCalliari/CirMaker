# Compila e testa em Linux e Windows a cada push/PR. Uma tag v* (ex. v0.2.0)
# publica um release no GitHub com o .zip do Windows (Qt + ngspice embutidos).
#   git tag v0.2.0 && git push origin v0.2.0
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  NGSPICE_VER: '47'

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libreadline-dev
      # o ngspice do Ubuntu (42) não aceita o d_cosim como o usamos: o mesmo
      # ngspice do pacote do Windows, compilado uma vez e guardado em cache
      - name: Cache do ngspice
        id: ngspice-cache
        uses: actions/cache@v4
        with:
          path: ~/ngspice
          key: ngspice-linux-${{ env.NGSPICE_VER }}
      - name: Compilar o ngspice
        if: steps.ngspice-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o ngspice.tar.gz "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${NGSPICE_VER}/ngspice-${NGSPICE_VER}.tar.gz/download"
          tar xzf ngspice.tar.gz
          cd ngspice-${NGSPICE_VER}
          ./configure --prefix=$HOME/ngspice --with-ngshared --enable-xspice --enable-cider --disable-debug --enable-openmp
          make -j$(nproc)
          make install
      - name: Usar o ngspice
        run: |
          echo "LD_LIBRARY_PATH=$HOME/ngspice/lib" >> "$GITHUB_ENV"
          echo "SPICE_SCRIPTS=$HOME/ngspice/share/ngspice/scripts" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - name: Compilar e testar
        run: ./build.sh --test

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true
      - name: Versão
        id: ver
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v=${GITHUB_REF#refs/tags/v}; else v=$(git rev-parse --short HEAD); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache do ngspice
        uses: actions/cache@v4
        with:
          path: dist/ngspice-${{ env.NGSPICE_VER }}
          key: ngspice-${{ env.NGSPICE_VER }}
      - name: Compilar, testar e empacotar
        shell: cmd
        env:
          MINGW_DIR: ${{ env.IQTA_TOOLS }}\mingw1310_64\bin
          CM_VERSION: ${{ steps.ver.outputs.version }}
        run: build.bat test package
      - uses: actions/upload-artifact@v4
        with:
          name: CirMaker-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/CirMaker-*-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
